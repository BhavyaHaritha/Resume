<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Bhavya CLI Resume</title>
    <style>
      :root {
        --bg-color: #0c0c0c;
        --text-color: #00ff00;
        --highlight-color: #00aa00;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Courier New", monospace;
        font-size: 16px;
        line-height: 1.5;
        padding: 20px;
        margin: 0;
      }

      #terminal {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        height: 70vh;
        overflow-y: auto;
        border: 1px solid var(--text-color);
        padding: 10px;
        box-sizing: border-box;
      }

      #input-line {
        display: flex;
        align-items: center;
      }

      #prompt {
        color: var(--highlight-color);
        margin-right: 5px;
      }

      #input {
        background-color: transparent;
        border: none;
        color: var(--text-color);
        font-family: inherit;
        font-size: inherit;
        flex-grow: 1;
        outline: none;
      }

      .command {
        color: var(--highlight-color);
      }

      .section-title {
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 5px;
      }

      .section-content {
        margin-left: 20px;
      }

      @media (max-width: 600px) {
        body {
          font-size: 14px;
        }

        #terminal {
          height: 60vh;
        }
      }
    </style>
  </head>

  <body>
    <div id="terminal"></div>
    <div id="input-line">
      <span id="prompt">$</span>
      <input type="text" id="input" autofocus />
    </div>
    <script>
      const terminal = document.getElementById("terminal");
      const input = document.getElementById("input");
      const resume = {
        name: "Bhavya Mutyala",
        experience: [
          {
            company: "Optum",
            role: "Associate Software Engineer 2",
            period: "April 2024 - Present",
            description: ["Implemented Trivy integration into CI/CD pipelines, establishing a DevSecOps framework that enabled early vulnerability detection and reduced post-deployment security incidents by approximately 65%.",
            "Engineered modernization and maintenance of six Azure API Management (APIM) services, executing Jenkins to GitHub Actions migration, Node.js and Terraform upgrades, npm and TypeScript fixes, artifact governance improvements.",
            "Enhanced platform security by resolving vulnerabilities and performing Postman-based API validation and end-to-end testing after each update, ensuring consistent production stability.",
            "Provisioned and managed Azure cloud infrastructure using Terraform and Azure CLI, standardizing deployments and improving environment consistency across teams.",
            "Led migration of conversational AI platforms from Azure Bot Composer to Google Dialogflow CX, architecting conversational flows, intents, and API integrations for scalability and reliability.",
            "Implemented proactive monitoring and alerting systems on Google Cloud (GCP), ensuring 24/7 uptime and accelerating incident detection.",
            "Automated performance-testing workflows using Cyara, reducing manual QA time by 30%.",
            "Designed and delivered Power BI dashboards for healthcare data analytics."]     
          },
          {
            company: "Innovation Communication Systems",
            role: "Intern",
            period: "October 2023 - February 2024",
            description: ["Developed and deployed an automated tablet defect detection system using YOLOv5 and OpenCV, achieving an accuracy rate of 98.5% across multiple defect categories.",
            "Streamlined the image preprocessing pipeline through contrast enhancement, noise filtering, and morphological transformations, resulting in a 30% faster inference speed."]       
          },
          {
            company: "The Weekend Experts",
            role: "Business Analyst Intern",
            period: "March 2022 – June 2023",
            description: ["Developed a product roadmap outlining key milestones, timelines, and KPIs for a podcast streaming platform, aligning business goals with technical feasibility and user experience priorities.",
            "Delivered strategic presentations to healthcare professionals, demonstrating the value of digital branding and online presence, resulting in a 60% conversion rate to subscription-based digital portfolio services.",
            "Created and executed a social media content calendar for ACE IELTS, increasing engagement and reach by approximately 40% within 3 months through data-driven content planning and scheduling.",
            "Prepared competitive benchmarking reports and performance dashboards to support management in decision-making and content optimization."]
          },
          {
            company:
              "Research and Training Unit for Navigational Electronics (NERTU)",
            role: "Intern",
            period: "May 2022 - August 2022",
            description: ["Designed and implemented advanced GNSS receiver algorithms including RAIM, TRAIM, and multipath mitigation, improving positioning accuracy by 20%.",
            "Applied signal processing techniques to analyze real-world GNSS signals and develop fault detection logic.",
            "Gained in-depth understanding of satellite navigation systems through robust experimentation and testing."]
          },
        ],
        skills: [
          "Programming & Scripting: Python, Node.js, SQL, Java",
          "DevOps & CI/CD: GitHub Actions, Jenkins, Docker, Terraform",
          "Cloud Platforms: Microsoft Azure, Google Cloud Platform (GCP), Amazon Web Services (AWS)",
          "Infrastructure & Automation: Azure CLI, Infrastructure-as-Code (IaC), API Management (APIM)",
          "Testing & Quality: Postman, Cyara", 
          "Generative AI & LLM Systems: LangChain, LangGraph, OpenAI GPT, ReAct Agent Architecture, Prompt Engineering, LLM Workflow Design", 
          "Machine Learning & NLP: Databricks, YOLOv5, OpenCV, Dialogflow CX, Azure Bot Composer", 
          "Data & Analytics: SQL, Excel, Power BI, Tableau", 
          "Tools & Version Control: Git, GitHub, VS Code, Linux, PowerShell", 
          "Core CS: Operating Systems, Computer Networking", 
          "Soft Skills: Problem-Solving, Cross-Functional Collaboration, Analytical Thinking, Agile Methodologies", 
          "Business Tools: Jira, Confluence, MS PowerPoint, MS Visio", 
          "Methodologies: Agile, SDLC",
        ],
        education: [
          {
            degree: "B.E in Computer Science and Engineering",
            institution: "University College of Engineering, Osmania University",
            year: 2023 ,
            CGPA: 8.62
          },
        ],
        certifications: [
            "Microsoft Certified: Azure Fundamentals (AZ-900) – Microsoft, Nov 2024",
            "Generative AI Certification – Optum Tech University AI Dojo, Sep 2025",
        ],
        contact: {
          email: "mbhavya864@gmail.com",
          linkedin: "www.linkedin.com/in/bhavya-mutyala",
        }, 
        projects: [
          {
            name: "Placement Management System for University College of Engineering, Osmania University",
            description: ["Developed a full-stack web application to digitize the university’s placement process, reducing manual record-keeping time.",
            "Designed and implemented a normalized MySQL database with 10+ interconnected tables to store student, recruiter, and placement data, cutting retrieval time by 40%.",
            "Built secure backend APIs for authentication, job postings, and application management, handling 1,000+ student records efficiently."]
          },
          {
            name: "AI-Driven Healthcare Insurance Claim Approval Agent",
            description: ["Engineered an end-to-end agentic AI pipeline using LangGraph ReAct architecture, automating healthcare claim validation through structured LLM reasoning and decision-making.",
            "Integrated three domain-specific tools (summarize_patient_record, summarize_policy_guideline, check_claim_coverage) with modular tool-use orchestration for deterministic workflow execution.",
            "Implemented a scalable Python-based data processing layer for JSON ingestion, policy retrieval, and eligibility evaluation, achieving >90% classification accuracy on benchmark datasets.",
            "Optimized prompt templates and tool-chain logic to enhance reasoning traceability, reduce LLM hallucinations, and ensure explainable decision generation."]
          },
        ],
      };
      const commandHistory = [];
      let historyIndex = -1;
      function displayOutput(text, isCommand = false) {
        const output = document.createElement("div");
        output.innerHTML = isCommand
          ? `<span class="command">${text}</span>`
          : text;
        terminal.appendChild(output);
        terminal.scrollTop = terminal.scrollHeight;
      }
      function processCommand(cmd) {
        const [command, ...args] = cmd.toLowerCase().split(" ");
        switch (command) {
          case "help":
            return `Available commands:
                     - name
                     - education
                     - skills
                     - certifications
                     - experience
                     - projects
                     - contact
                     - clear
                     - all`;
          case "name":
            return `<div><strong>Name:</strong> ${resume.name}</div>`;

          case "experience":
            return `
<div><strong>Experience:</strong></div>
<div>
                           ${resume.experience
                             .map(
                               (exp) => `
<div>
<div><strong>Company:</strong> ${exp.company}</div>
<div><strong>Role:</strong> ${exp.role}</div>
<div><strong>Period:</strong> ${exp.period}</div>
<div><strong>Description:</strong></div>
<ul>
                      ${(Array.isArray(exp.description) ? exp.description : []).map(point => `<li>${point}</li>`).join('')}
</ul>
<br>
</div>
           `).join('')}
</div>
                   `;

          case "skills":
            return `
<div><strong>Skills:</strong></div>
<div>
                           ${resume.skills
                             .map((skill) => `<div>${skill}</div>`)
                             .join("")}
</div>
                   `;
          case "certifications":
            return `
      <div><strong>Certifications:</strong></div>
      <div>
                          ${resume.certifications
                            .map((certification) => `<div>${certification}</div>`)
                             .join("")}
                        
      </div>
                 `;
          case "education":
            return `
      <div><strong>Education:</strong></div>
      <div>${resume.education
        .map((edu) => `${edu.degree} from ${edu.institution} in the year ${edu.year} with a CGPA of ${edu.CGPA}`)
        .join("<br>")}</div>
                 `;
          case "contact":
            return `
      <div><strong>Contact:</strong></div>
      <div>
                         Email: ${resume.contact.email}<br>
                         LinkedIn: ${resume.contact.linkedin}
      </div>
                 `;
                 case 'projects':
           return `
<div><strong>Projects:</strong></div>
<div>
                   ${resume.projects.map(proj => `
<div>
<div><strong>Project Name:</strong> ${proj.name}</div>
<div><strong>Description:</strong></div>
<ul>
                               ${Array.isArray(proj.description) ? proj.description.map(point => `<li>${point}</li>`).join('') : '<li>No description available</li>'}
</ul>
<br>
</div>
                   `).join('')}
</div>
           `;
          case "clear":
            terminal.innerHTML = "";
            return "";
          case "all":
            return `
<div class="section-title">Name</div>
<div class="section-content">${resume.name}</div>
<div class="section-title">Education</div>
<div class="section-content">${resume.education
              .map(
                (edu) => `${edu.degree} from ${edu.institution} in the year ${edu.year}) with a CGPA of ${edu.CGPA}`
              )
              .join("<br>")}</div>
<div class="section-title">Skills</div>
<div class="section-content">
                           ${resume.skills
                             .map((skill) => `<div>${skill}</div>`)
                             .join("")}
</div>
<div class="section-title">Certifications</div>
<div class="section-content">
                           ${resume.certifications
                             .map((certification) => `<div>${certification}</div>`)
                             .join("")}
</div>
<div class="section-title">Experience</div>
<div class="section-content">
                           ${resume.experience
                             .map(
                               (exp) => `
<div>
<div><strong>Company:</strong> ${exp.company}</div>
<div><strong>Role:</strong> ${exp.role}</div>
<div><strong>Period:</strong> ${exp.period}</div>
<div><strong>Description:</strong></div>
<ul>
    ${(Array.isArray(exp.description) ? exp.description : []).map(point => `<li>${point}</li>`).join('')}
</ul>
<br>
</div>
           `).join('')}
</div>

<div class="section-title">Projects</div>
<div class="section-content">
                   ${resume.projects.map(proj => `
<div>
<div><strong>Project Name:</strong> ${proj.name}</div>
<div><strong>Description:</strong></div>
<ul>
                               ${Array.isArray(proj.description) ? proj.description.map(point => `<li>${point}</li>`).join('') : '<li>No description available</li>'}
</ul>
<br>
</div>
                   `).join('')}
</div>


<div class="section-title">Contact</div>
<div class="section-content">
                           Email: ${resume.contact.email}<br>
                           LinkedIn: ${resume.contact.linkedin}
</div>
                   `;
          default:
            return `Command not recognized. Type "resume" to view the contents of Bhavya's Resume.`;
        }
      }

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          const cmd = input.value;
          displayOutput(`$ ${cmd}`, true);
          const result = processCommand(cmd);
          displayOutput(result);
          commandHistory.unshift(cmd);
          historyIndex = -1;
          input.value = "";
        } else if (event.key === "ArrowUp") {
          historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1);
          input.value = commandHistory[historyIndex] || "";
          event.preventDefault();
        } else if (event.key === "ArrowDown") {
          historyIndex = Math.max(historyIndex - 1, -1);
          input.value = commandHistory[historyIndex] || "";
          event.preventDefault();
        }
      });
      displayOutput(
        'Type "resume" to view Bhavya's Resume.'
      );
    </script>
  </body>
</html>
